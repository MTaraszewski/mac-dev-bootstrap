# Additions for machines with 48GB+ of unified memory.
#
# pull-models.sh uses this INSTEAD of models.conf when lib/host.sh reports
# >=48GB, so it must repeat the resident core.
#
# Total on disk if you take everything uncommented here: ~29GB.
# Add deepseek-r1:70b and it is ~72GB. Check free space first.

# ── resident core (same as models.conf) ──────────────────────────────────
qwen2.5-coder:1.5b      # ~1GB   | FIM autocomplete
nomic-embed-text        # ~0.3GB | embeddings

# ── big slot: swap by task with ./scripts/model.sh ───────────────────────

# Coding default here. 30B MoE with ~3.3B active parameters, so it decodes
# faster than a dense 32B while answering like a 30B. Needs num_ctx raised
# for agent work — see modelfiles/agent.Modelfile.
qwen3-coder:30b         # ~19GB

# Fast reasoning, 128K context. Cap context near 60K; throughput falls off a
# cliff at the top of the window.
gpt-oss:20b             # ~14GB

# Agentic / multi-file. Built for the read-edit-verify loop, not for chat.
devstral:24b            # ~14GB

# ── the 70B tier: opt in deliberately ────────────────────────────────────
# ~43GB, and it only stays fully on the GPU with a raised cap
# (./scripts/gpu-limit.sh). Expect single-digit tok/s: decode is
# bandwidth-bound, so 43GB at 400 GB/s is ~9 tok/s no matter what you tune.
# Worth it for depth, painful for anything interactive.
# deepseek-r1:70b       # ~43GB  | chain-of-thought reasoning
# llama3.3:70b          # ~43GB  | faster, no CoT. Redundant with the above —
#                       #          they cannot both be resident.
