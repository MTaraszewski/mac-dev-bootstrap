# Models pulled by scripts/pull-models.sh. One tag per line; # comments out.
#
# This is the CONSERVATIVE manifest — it fits a 24GB Mac. Machines with 48GB+
# also get models.big.conf on top (see there).
#
# ── THE ARCHITECTURE: a tiny resident core + ONE big slot ─────────────────
# You are never running a coder AND a reasoner AND a vision model at once, so
# don't budget for it. Keep the core always loaded and swap the large model
# by task:  ./scripts/model.sh code | reason | agent | status
#
# Check your actual budget first:  ./scripts/ram.sh
# Verify tags exist:               https://ollama.com/library

# ═════════════════════════════════════════════════════════════════════════
# RESIDENT CORE — always loaded, ~1.3GB total
# ═════════════════════════════════════════════════════════════════════════

# Autocomplete. MUST be a fill-in-the-middle model. A chat model here emits
# garbage no matter how big it is — FIM is a training objective, not a size.
# This is the single most common way a local autocomplete setup disappoints.
qwen2.5-coder:1.5b      # ~1GB

# Embeddings, 768 dimensions. If you point pgvector at this, the column must
# be VECTOR(768) — a dimension mismatch fails at query time, not insert time.
nomic-embed-text        # ~0.3GB

# ═════════════════════════════════════════════════════════════════════════
# BIG SLOT — one at a time. Swap with scripts/model.sh.
# ═════════════════════════════════════════════════════════════════════════

# Coding default. Fits the big slot on a 24GB machine at the DEFAULT GPU cap,
# leaving room for an editor and a database.
qwen2.5-coder:14b       # ~9GB

# Reasoning. Apache 2.0, MXFP4. 128K context — but cap it around 60K:
# throughput collapses at the top of the window.
# gpt-oss:20b           # ~14GB — needs a raised cap on 24GB. ./scripts/gpu-limit.sh

# Agentic / multi-file editing. Built for the read-edit-verify loop.
# devstral:24b          # ~14GB — same caveat
